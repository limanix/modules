# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  nix:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.4/taskfiles/nix/Taskfile.yml
    internal: true
  python:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.4/taskfiles/python/Taskfile.yml
    internal: true

tasks:
  docs/prepare:
    desc: Build docs for the LimaNix site
    vars:
      modules_ref:
        sh: |
          {{if .MODULES_REF}}
          printf '%s\n' {{.MODULES_REF | shellQuote}}
          {{else}}
          git -C {{.ROOT_DIR | shellQuote}} rev-parse HEAD
          {{end}}
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: python scripts/build_docs.py --ref {{.modules_ref | shellQuote}}

  nixpkgs/update:
    desc: Update the Nixpkgs revision
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: nix flake update nixpkgs --flake path:.

  ci/fmt:
    desc: Check Nix formatting
    cmds:
      - task: nix:nixfmt

  ci/lint:
    desc: Lint Nix modules and checks
    cmds:
      - task: nix:statix
      - task: nix:deadnix

  ci/test:
    desc: Validate the catalog and evaluate NixOS configs
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: >-
            nix eval --show-trace --json
            --option allow-import-from-derivation false
            --file checks/default.nix
            {{if .ARCH}}{{.ARCH | shellQuote}}{{end}}
