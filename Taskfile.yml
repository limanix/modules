# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  nix:
    # v0.0.5
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/81255f635d839a2b46417720676cd2bebfc10cff/taskfiles/nix/Taskfile.yml
    internal: true
  python:
    # v0.0.5
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/81255f635d839a2b46417720676cd2bebfc10cff/taskfiles/python/Taskfile.yml
    internal: true
  markdown:
    # v0.0.5
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/81255f635d839a2b46417720676cd2bebfc10cff/taskfiles/markdown/Taskfile.yml
    internal: true

vars:
  NIX_VERSION: '2.35.2'
  markdown_paths: README.md catalog guides

  nix_build_caps: >-
    --cap-add=DAC_OVERRIDE --cap-add=CHOWN --cap-add=FOWNER
    --cap-add=SETUID --cap-add=SETGID --cap-add=KILL

  nix_cache_env: XDG_CACHE_HOME=/workspace/.cache

tasks:
  ci/lint:
    desc: Run static checks
    cmds:
      - task: lint/nix
      - task: lint/markdown

  ci/test/modules:
    desc: >-
      Test catalog modules. MODULES="go docker" (default: all, one after another);
      MODE=check (eval, then run; default), eval, run or vm (needs CONTAINER_RUN_ARGS=--device=/dev/kvm)
    cmds:
      - task: _nix/check
        vars:
          CMD: >-
            bash scripts/run_checks.sh module {{.MODE | default "check" | shellQuote}}
            {{.MODULES | default "" | shellQuote}}

  ci/test/common:
    desc: >-
      Test the shared layer (_shared/test.nix) and the harness (checks/).
      SUITE=common (both; default), shared or platform; MODE=check (default), eval or run (eval and run need SUITE=shared or platform)
    cmds:
      - task: _nix/check
        vars:
          CMD: >-
            bash scripts/run_checks.sh {{.SUITE | default "common" | shellQuote}}
            {{.MODE | default "check" | shellQuote}}

  lint/nix:
    desc: Check Nix formatting
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: >-
            bash -c 'status=0;
            find . \( -path ./.git -o -path ./.cache -o -path ./.task -o -path ./build \) -prune
            -o -type f -name "*.nix" -exec nixfmt --check {} + || status=1;
            statix check . || status=1;
            deadnix --fail . || status=1;
            exit "$status"'
          TASK_CONTEXT:
            ref: 'merge (dict) (dict "CONTAINER_MOUNT_MODE" "ro" "CONTAINER_USER" "host") (.TASK_CONTEXT | default .)'

  lint/nix/fix:
    desc: Format Nix files in place
    cmds:
      - task: nix:nixfmt
        vars:
          FMT_ARGS: ''

  lint/markdown:
    desc: Check Markdown formatting
    cmds:
      - task: markdown:fmt
        vars:
          FMT_PATHS: '{{.markdown_paths}}'
          TASK_CONTEXT:
            ref: 'merge (dict) (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  lint/markdown/fix:
    desc: Format Markdown in place
    cmds:
      - task: markdown:fmt/fix
        vars:
          FMT_PATHS: '{{.markdown_paths}}'

  nixpkgs/update:
    desc: Update the pinned Nixpkgs revision in flake.lock
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: nix flake update nixpkgs --flake path:.

  nixpkgs/update/unstable:
    desc: Move the catalog's nixos-unstable revision in catalog/_shared/unstable.toml to the channel's newest one
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: bash scripts/update_unstable.sh

  release/build:
    desc: "Build the base disk; ARCH=aarch64 or x86_64 (default: the host), natively only"
    requires:
      vars:
        - name: ARCH
          enum: [aarch64, x86_64]
    vars:
      ARCH: '{{.ARCH | default (ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64")}}'
      host_arch: '{{ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64"}}'
    preconditions:
      - sh: test {{.ARCH | shellQuote}} = {{.host_arch | shellQuote}}
        msg: Images build natively; build {{.ARCH}} on an {{.ARCH}} machine.
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: sh scripts/build_image.sh {{.ARCH}}
          TASK_CONTEXT:
            ref: >-
              merge (dict) (dict
              "CONTAINER_RUN_ARGS" (printf "--security-opt seccomp=unconfined --security-opt apparmor=unconfined %s %s" .nix_build_caps (.CONTAINER_RUN_ARGS | default ""))
              "CONTAINER_VOLUMES" (printf "limanix-modules-nix:/nix %s" (.CONTAINER_VOLUMES | default ""))) (.TASK_CONTEXT | default .)

  docs/prepare:
    desc: >-
      Prepare this repository's pages for the LimaNix site in build/docs.
      MODULES_REF=<tag or commit> (default: HEAD). The docs repository calls this task by name
    vars:
      modules_ref:
        sh: |
          {{if .MODULES_REF}}
          printf '%s\n' {{.MODULES_REF | shellQuote}}
          {{else}}
          git -C {{.ROOT_DIR | shellQuote}} rev-parse HEAD
          {{end}}
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: python scripts/build_docs.py --ref {{.modules_ref | shellQuote}}

  _nix/check:
    internal: true
    requires:
      vars: [ CMD ]
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: '{{.CMD}}'
          TASK_CONTEXT:
            ref: >-
              merge (dict) (.TASK_CONTEXT | default .) (dict
              "CONTAINER_RUN_ARGS" (printf "%s %s" .nix_build_caps (.CONTAINER_RUN_ARGS | default ""))
              "CONTAINER_ENVS" (printf "%s %s" .nix_cache_env (.CONTAINER_ENVS | default "")))
