# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  nix:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.4/taskfiles/nix/Taskfile.yml
    internal: true
  python:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.4/taskfiles/python/Taskfile.yml
    internal: true

tasks:
  ci/scripts:
    desc: Test change planning, diagnostics and runner limits
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: python -B -m unittest discover -s scripts/tests

  docs/prepare:
    desc: Build docs for the LimaNix site
    vars:
      modules_ref:
        sh: |
          {{if .MODULES_REF}}
          printf '%s\n' {{.MODULES_REF | shellQuote}}
          {{else}}
          git -C {{.ROOT_DIR | shellQuote}} rev-parse HEAD
          {{end}}
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: python scripts/build_docs.py --ref {{.modules_ref | shellQuote}}

  nixpkgs/update:
    desc: Update the Nixpkgs revision
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: nix flake update nixpkgs --flake path:.

  ci/nixos-fmt:
    desc: Check Nix formatting
    cmds:
      - task: nix:nixfmt

  ci/nixos-lint:
    desc: Lint Nix modules and checks
    cmds:
      - task: nix:statix
      - task: nix:deadnix

  ci/test:
    desc: Run complete native checks; RUNTIME_PROFILE=pr selects current and requested runtime lines
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: >-
            {{if or .RUNTIME_PROFILE .RUNTIME_VERSIONS}}env NIX_RUNTIME_PROFILE={{.RUNTIME_PROFILE | default "all" | shellQuote}} NIX_RUNTIME_VERSIONS={{.RUNTIME_VERSIONS | default "" | shellQuote}}{{end}}
            bash scripts/run_checks.sh modules {{.MODULES | default "" | shellQuote}}
          TASK_CONTEXT:
            ref: 'merge (dict) (.TASK_CONTEXT | default .) (dict "CONTAINER_RUN_ARGS" (printf "--cap-add=DAC_OVERRIDE --cap-add=CHOWN --cap-add=FOWNER --cap-add=SETUID --cap-add=SETGID --cap-add=KILL %s" (.CONTAINER_RUN_ARGS | default "")))'

  ci/common:
    desc: Run shared contracts; INTEGRATION_GROUP selects a deep evaluation group
    cmds:
      - task: nix:_nix/tool
        vars:
          CMD: >-
            {{if .INTEGRATION_GROUP}}env NIX_INTEGRATION_GROUP={{.INTEGRATION_GROUP | shellQuote}}{{end}}
            bash scripts/run_checks.sh common {{.MODE | default "pr" | shellQuote}}
          TASK_CONTEXT:
            ref: 'merge (dict) (.TASK_CONTEXT | default .) (dict "CONTAINER_RUN_ARGS" (printf "--cap-add=DAC_OVERRIDE --cap-add=CHOWN --cap-add=FOWNER --cap-add=SETUID --cap-add=SETGID --cap-add=KILL %s" (.CONTAINER_RUN_ARGS | default "")))'
