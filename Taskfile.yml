# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  nix:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/nix/Taskfile.yml
    internal: true
  markdown:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/markdown/Taskfile.yml
    internal: true

vars:
  NIX_VERSION: '2.35.2'

  nix_build_caps: >-
    --cap-add=DAC_OVERRIDE
    --cap-add=CHOWN
    --cap-add=FOWNER
    --cap-add=SETUID
    --cap-add=SETGID
    --cap-add=KILL

  nix_files: >-
    find . \( -path ./.git -o -path ./.cache -o -path ./.task -o -path ./build \) -prune
    -o -type f -name "*.nix"

  nix_cache_env: XDG_CACHE_HOME=/workspace/.cache
  markdown_paths: README.md catalog

tasks:
  ci/lint:
    desc: Run static checks
    cmds:
      - task: lint/nix
      - task: lint/markdown

  ci/test/modules:
    desc: Test catalog modules
    cmds:
      - task: _nix/check
        vars:
          CMD: >-
            bash scripts/run_checks.sh module
            {{.MODE | default "check" | shellQuote}}
            {{.MODULES | default "" | shellQuote}}

  ci/test/layer:
    desc: Test the shared layer
    cmds:
      - task: _nix/check
        vars:
          CMD: >-
            bash scripts/run_checks.sh
            {{.SUITE | default "common" | shellQuote}}
            {{.MODE | default "check" | shellQuote}}

  lint/nix:
    desc: Check Nix formatting
    cmds:
      - task: nix:exec
        vars:
          CMD: |
            bash -c '
              status=0
              {{.nix_files}} -exec nixfmt --check {} + || status=1
              statix check . || status=1
              deadnix --fail . || status=1
              exit "$status"
            '
          CONTAINER_MOUNT_MODE: ro

  lint/nix/fix:
    desc: Format Nix files in place
    cmds:
      - task: nix:exec
        vars:
          CMD: |
            bash -c '{{.nix_files}} -exec nixfmt {} +'

  lint/markdown:
    desc: Check Markdown formatting
    cmds:
      - task: markdown:fmt
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  lint/markdown/fix:
    desc: Format Markdown in place
    cmds:
      - task: markdown:fmt/fix
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  release/build:
    desc: Build image
    requires:
      vars:
        - name: ARCH
          enum: [aarch64, x86_64]
    vars:
      ARCH: '{{.ARCH | default (ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64")}}'
      host_arch: '{{ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64"}}'
    preconditions:
      - sh: test {{.ARCH | shellQuote}} = {{.host_arch | shellQuote}}
        msg: Images build natively; build {{.ARCH}} on an {{.ARCH}} machine.
    cmds:
      - task: nix:exec
        vars:
          CMD: sh scripts/build_image.sh {{.ARCH}}
          CONTAINER_RUN_ARGS: >-
            --security-opt seccomp=unconfined
            --security-opt apparmor=unconfined
            {{.nix_build_caps}}
            {{.CONTAINER_RUN_ARGS | default ""}}
          CONTAINER_VOLUMES: >-
            limanix-modules-nix:/nix
            {{.CONTAINER_VOLUMES | default ""}}

  _nix/check:
    internal: true
    requires:
      vars: [ CMD ]
    cmds:
      - task: nix:exec
        vars:
          CONTAINER_RUN_ARGS: >-
            {{.nix_build_caps}}
            {{.CONTAINER_RUN_ARGS | default ""}}
          CONTAINER_ENVS: >-
            {{.nix_cache_env}}
            {{.CONTAINER_ENVS | default ""}}
          CMD: '{{.CMD}}'
