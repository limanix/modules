# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'
silent: true

includes:
  nix:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/nix/Taskfile.yml
    internal: true
  markdown:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/markdown/Taskfile.yml
    internal: true

vars:
  NIX_IMAGE: ghcr.io/mr-chelyshkin/ci/nix:2.35.2@sha256:546ed6d23f4df0c3c81b5b6af427f7a8f4647e54e7e4100280c686838b96bb80

  nix_cache_env: XDG_CACHE_HOME=/workspace/.cache
  nix_build_caps: >-
    --cap-add=DAC_OVERRIDE
    --cap-add=CHOWN
    --cap-add=FOWNER
    --cap-add=SETUID
    --cap-add=SETGID
    --cap-add=KILL

  markdown_paths: README.md catalog
  harness: python3 tools/harness

tasks:
  ci/nix/fmt:
    desc: Check Nix formatting
    cmds:
      - task: nix:fmt

  ci/nix/lint:
    desc: Lint Nix files
    cmds:
      - task: nix:lint

  ci/markdown/fmt:
    desc: Check Markdown formatting
    cmds:
      - task: markdown:fmt
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  ci/python/fmt:
    desc: Check the formatting of the harness
    cmds:
      - task: _python
        vars:
          CMD: ruff format --check --no-cache .

  ci/python/lint:
    desc: Lint the harness
    cmds:
      - task: _python
        vars:
          CMD: ruff check --no-cache .

  ci/python/typecheck:
    desc: Type-check the harness
    cmds:
      - task: _python
        vars:
          CMD: mypy --cache-dir /dev/null

  ci/python/test:
    desc: Run the tests
    cmds:
      - task: _python
        vars:
          CMD: pytest -p no:cacheprovider -q

  ci/catalog/modules:
    desc: Check the named catalog modules
    cmds:
      - task: _catalog/check
        vars:
          CMD: >-
            {{.harness}} check module
            {{.MODE | default "check" | shellQuote}}
            {{.MODULES | default "" | shellQuote}}

  ci/catalog/layer:
    desc: Check the shared layer
    cmds:
      - task: _catalog/check
        vars:
          CMD: >-
            {{.harness}} check
            {{.SUITE | default "common" | shellQuote}}
            {{.MODE | default "check" | shellQuote}}

  harness:
    desc: Run a harness commands
    cmds:
      - task: nix:exec
        vars:
          CMD: '{{.harness}} {{.CLI_ARGS}}'
          CONTAINER_RUN_ARGS: >-
            {{.nix_build_caps}}
            {{.CONTAINER_RUN_ARGS | default ""}}
          CONTAINER_ENVS: >-
            GH_TOKEN GITHUB_REPOSITORY PYTHONDONTWRITEBYTECODE=1
            {{.CONTAINER_ENVS | default ""}}

  nix/fmt/fix:
    desc: Format Nix files in place
    cmds:
      - task: nix:fmt/fix

  nix/lint/fix:
    desc: Apply the statix and deadnix fixes in place
    cmds:
      - task: nix:lint/fix

  markdown/fmt/fix:
    desc: Format Markdown in place
    cmds:
      - task: markdown:fmt/fix
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  python/fmt/fix:
    desc: Format the harness in place
    cmds:
      - task: _python
        vars:
          CMD: ruff format --no-cache .
          CONTAINER_MOUNT_MODE: rw

  python/lint/fix:
    desc: Apply the fixes to the harness in place
    cmds:
      - task: _python
        vars:
          CMD: ruff check --fix --no-cache .
          CONTAINER_MOUNT_MODE: rw

  generate/graph:
    desc: Write catalog/graph.json
    cmds:
      - task: harness
        vars:
          CLI_ARGS: graph
          CONTAINER_USER: host

  generate/previews:
    desc: Write previews/, the theme and prompt previews the site shows
    cmds:
      - task: harness
        vars:
          CLI_ARGS: previews
          CONTAINER_RUN_ARGS: --hostname example-box

  release/build:
    desc: Build the base disk of ARCH into dist/
    requires:
      vars:
        - name: ARCH
          enum: [aarch64, x86_64]
    vars:
      ARCH: '{{.ARCH | default (ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64")}}'
      host_arch: '{{ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64"}}'
    preconditions:
      - sh: test {{.ARCH | shellQuote}} = {{.host_arch | shellQuote}}
        msg: Disks build natively; build {{.ARCH}} on an {{.ARCH}} machine.
    cmds:
      - task: nix:exec
        vars:
          CMD: '{{.harness}} release build {{.ARCH}}'
          CONTAINER_RUN_ARGS: >-
            --security-opt seccomp=unconfined
            --security-opt apparmor=unconfined
            {{.nix_build_caps}}
            {{.CONTAINER_RUN_ARGS | default ""}}
          CONTAINER_VOLUMES: >-
            limanix-modules-nix:/nix
            {{.CONTAINER_VOLUMES | default ""}}

  _catalog/check:
    internal: true
    requires:
      vars: [ CMD ]
    cmds:
      - task: nix:exec
        vars:
          CONTAINER_RUN_ARGS: >-
            {{.nix_build_caps}}
            {{.CONTAINER_RUN_ARGS | default ""}}
          CONTAINER_ENVS: >-
            {{.nix_cache_env}}
            {{.CONTAINER_ENVS | default ""}}
          CMD: '{{.CMD}}'

  _python:
    internal: true
    requires:
      vars: [ CMD ]
    cmds:
      - task: nix:exec
        vars:
          NIX_DIR: tools
          CMD: '{{.CMD}}'
          CONTAINER_MOUNT_MODE: '{{.CONTAINER_MOUNT_MODE | default "ro"}}'
          CONTAINER_ENVS: PYTHONDONTWRITEBYTECODE=1
          CONTAINER_USER: host
