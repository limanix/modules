name: PR flow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'

      - name: Select targets
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            task --yes harness -- plan --all >> "$GITHUB_OUTPUT"
          else
            task --yes harness -- plan --base HEAD^1 >> "$GITHUB_OUTPUT"
          fi

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/nix/fmt
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/nix/lint
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/markdown/fmt
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/python/fmt
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/python/lint
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/python/typecheck
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/python/test

  test:
    name: Test ${{ matrix.target }} (${{ matrix.runner }})
    timeout-minutes: 20
    needs: plan
    if: ${{ needs.plan.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Nix sources
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: nix-v1.0-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('flake.lock', 'flake.nix', 'interface.nix', 'catalog/_shared/**', format('catalog/*/{0}/**', matrix.target), 'checks/**', 'tools/harness/**') }}
          restore-keys: |
            nix-v1.0-${{ runner.arch }}-${{ matrix.target }}-

      - name: Nix cache permissions
        run: |
          mkdir -p .cache/nix .cache/nix-binary
          sudo chown -R 0:0 .cache/nix .cache/nix-binary

      - name: Run checks
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ${{ matrix.target == 'common' && 'ci/catalog/layer' || 'ci/catalog/modules' }}
          args: |
            ${{ matrix.target != 'common' && format('MODULES={0}', matrix.target) || '' }}
            CONTAINER_ENVS=NIX_BUILD_CACHE=/workspace/.cache/nix-binary NIX_CHECK_JOBS=1 NIX_BUILD_CORES=0${{ steps.cache.outputs.cache-hit != 'true' && ' NIX_BUILD_CACHE_HOOK=/workspace/tools/harness/cache_hook.py' || '' }}

      - name: Restore Nix cache ownership
        if: always()
        run: |
          for directory in .cache/nix .cache/nix-binary; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done

      - name: Prune Nix build cache
        id: prune
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          task --yes harness CONTAINER_USER=host -- cache prune .cache/nix-binary
          rm -f .cache/nix/binary-cache-v*.sqlite*

      - name: Save Nix sources and local builds
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' && steps.prune.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: ${{ steps.cache.outputs.cache-primary-key }}

  image:
    needs: plan
    if: ${{ needs.plan.outputs.image == 'true' }}
    uses: ./.github/workflows/image.yml

  gate:
    if: always()
    needs: [plan, lint, test, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        uses: mr-chelyshkin/actions/job-results-check@v2
        with:
          results: ${{ toJSON(needs) }}
          skipped: >-
            ${{ needs.plan.outputs.targets == '[]' && 'test' || '' }}
            ${{ needs.plan.outputs.image == 'false' && 'image' || '' }}
