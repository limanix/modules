name: PR flow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select targets
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^1 HEAD)
          modules=$(ls catalog | grep -vx _shared)

          every='^(catalog/_shared/|checks/|flake\.nix$|flake\.lock$|interface\.nix$|scripts/run_checks\.sh$)'
          plumbing='^(Taskfile\.yml|\.taskrc\.yml|\.github/workflows/pr\.yml|scripts/cache_nix_build\.sh|scripts/prune_nix_cache\.sh)$'
          image='^(flake\.nix$|flake\.lock$|platform\.nix$|image\.nix$|scripts/build_image\.sh$|Taskfile\.yml$|\.github/workflows/pr\.yml$)'

          if [ "$EVENT_NAME" = workflow_dispatch ] || grep -qE "$every" <<< "$changed"; then
            targets="$modules common"
          else
            targets=$(grep -oE '^catalog/[^/]+/' <<< "$changed" | cut -d/ -f2 | grep -Fx "$modules" | sort -u || true)
            if grep -qE "$plumbing" <<< "$changed"; then targets="$targets common"; fi
          fi

          echo "targets=$(jq -cn '$ARGS.positional' --args $targets)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = workflow_dispatch ] || grep -qE "$image" <<< "$changed"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/lint

  test:
    name: Test ${{ matrix.target }} (${{ matrix.runner }})
    needs: [plan, lint]
    if: ${{ needs.plan.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Nix sources
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: nix-v1.0-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('flake.lock', 'flake.nix', 'interface.nix', 'catalog/_shared/**', format('catalog/{0}/**', matrix.target), 'checks/**', 'scripts/run_checks.sh', 'scripts/cache_nix_build.sh', 'scripts/prune_nix_cache.sh') }}
          restore-keys: |
            nix-v1.0-${{ runner.arch }}-${{ matrix.target }}-

      - name: Nix cache permissions
        run: |
          mkdir -p .cache/nix .cache/nix-binary
          sudo chown -R 0:0 .cache/nix .cache/nix-binary

      - name: Run checks
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ${{ matrix.target == 'common' && 'ci/test/common' || 'ci/test/modules' }}
          args: |
            ${{ matrix.target != 'common' && format('MODULES={0}', matrix.target) || '' }}
            CONTAINER_ENVS=NIX_BUILD_CACHE=/workspace/.cache/nix-binary NIX_CHECK_JOBS=1 NIX_BUILD_CORES=0${{ steps.cache.outputs.cache-hit != 'true' && ' NIX_BUILD_CACHE_HOOK=/workspace/scripts/cache_nix_build.sh' || '' }}

      - name: Restore Nix cache ownership
        if: always()
        run: |
          for directory in .cache/nix .cache/nix-binary; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done

      - name: Prune Nix build cache
        id: prune
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/prune_nix_cache.sh .cache/nix-binary
          rm -f .cache/nix/binary-cache-v*.sqlite*

      - name: Save Nix sources and local builds
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' && steps.prune.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: ${{ steps.cache.outputs.cache-primary-key }}

  image:
    name: Build image (${{ matrix.arch }})
    needs: [plan, lint]
    if: ${{ needs.plan.outputs.image == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: ubuntu-24.04-arm }
          - { arch: x86_64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow user namespaces for systemd-repart
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the image
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: release/build
          args: ARCH=${{ matrix.arch }}
      - name: Keep the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  gate:
    if: always()
    needs: [plan, lint, test, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        uses: mr-chelyshkin/actions/job-results-check@v2
        with:
          results: ${{ toJSON(needs) }}
          skipped: >-
            ${{ needs.plan.outputs.targets == '[]' && 'test' || '' }}
            ${{ needs.plan.outputs.image == 'false' && 'image' || '' }}
