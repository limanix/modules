name: PR flow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    needs: plan
    if: ${{ needs.plan.outputs.readme-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [ci/nixos-fmt, ci/nixos-lint]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ${{ matrix.task }}

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has-modules: ${{ steps.plan.outputs.has-modules }}
      readme-only: ${{ steps.plan.outputs.readme-only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Plan module checks
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            plan=$(python3 -B scripts/plan_checks.py --all)
          else
            plan=$(python3 -B scripts/plan_checks.py --base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          {
            printf 'chunks=%s\n' "$(jq -c '.chunks' <<< "$plan")"
            printf 'has-modules=%s\n' "$(jq -r '.modules | length > 0' <<< "$plan")"
            printf 'readme-only=%s\n' "$(jq -r '.readme_only' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          printf '### Module runtime scope\n\n| Module | Profile | Additional lines |\n| --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.chunks[] | "| \(.modules) | \(.runtime_profile) | \(.runtime_versions // "") |"' <<< "$plan" >> "$GITHUB_STEP_SUMMARY"
      - name: Test runner and change planning
        run: python3 -B -m unittest discover -s scripts/tests

  test:
    name: Modules (${{ matrix.runner }}, ${{ matrix.chunk.id }})
    needs: plan
    if: ${{ needs.plan.outputs.has-modules == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/nix-tests.yml
    with:
      task: ci/test
      runner: ${{ matrix.runner }}
      modules: ${{ matrix.chunk.modules }}
      cache-id: modules-${{ matrix.chunk.id }}
      runtime-profile: ${{ matrix.chunk.runtime_profile }}
      runtime-versions: ${{ matrix.chunk.runtime_versions }}

  common:
    name: Common (${{ matrix.runner }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/nix-tests.yml
    with:
      task: ci/common
      runner: ${{ matrix.runner }}
      mode: pr
      cache-id: common-pr

  pkgs:
    name: Check Nixpkgs updates
    needs: plan
    if: ${{ needs.plan.outputs.readme-only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Prepare lock file permissions
        run: sudo chown 0:0 flake.lock
      - name: Check for Nixpkgs updates
        id: update
        continue-on-error: true
        timeout-minutes: 5
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: nixpkgs/update }
      - name: Restore lock file ownership
        if: always()
        run: |
          if [ -f flake.lock ]; then
            sudo chown "$(id -u):$(id -g)" flake.lock
          fi
      - name: Write update summary
        if: always()
        shell: bash
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: python3 scripts/summarize_nixpkgs_updates.py

  gate:
    if: always()
    needs: [nix, plan, test, common]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
          skipped: ${{ needs.plan.result == 'success' && needs.plan.outputs.readme-only == 'true' && 'nix test' || (needs.plan.outputs.has-modules == 'false' && 'test' || '') }}
