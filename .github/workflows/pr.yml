name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    uses: mr-chelyshkin/actions/.github/workflows/pr-nix.yml@v1
    permissions:
      contents: read

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run Nix tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: 'ci/test ARCH=${{ matrix.arch }}' }

  gate:
    if: always()
    needs: [nix, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
