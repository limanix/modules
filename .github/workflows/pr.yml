name: PR flow

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

# A new push cancels the previous run of the same pull request. Runs on main
# get their own group: each one tests and caches its changed modules.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has-modules: ${{ steps.plan.outputs.has-modules }}
      common: ${{ steps.plan.outputs.common }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed modules
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] ||
             [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ] ||
             ! git --no-optional-locks cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            plan=$(python3 -B scripts/plan_checks.py --all)
          else
            plan=$(python3 -B scripts/plan_checks.py --base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          mkdir -p build
          printf '%s\n' "$plan" > build/check-plan.json
          printf 'needs-dependencies=%s\n' "$(jq -r '.needs_dependencies' <<< "$plan")" >> "$GITHUB_OUTPUT"

      # Consumers of changed modules come from the evaluated import graph.
      # If discovery fails, the plan falls back to the full catalog.
      - name: Read x86 module dependencies
        if: ${{ steps.changes.outputs.needs-dependencies == 'true' }}
        continue-on-error: true
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/plan/dependencies SYSTEM=x86_64-linux OUTPUT=build/dependencies-x86.json

      - name: Read ARM module dependencies
        if: ${{ steps.changes.outputs.needs-dependencies == 'true' }}
        continue-on-error: true
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/plan/dependencies SYSTEM=aarch64-linux OUTPUT=build/dependencies-arm.json

      - name: Plan checks
        id: plan
        shell: bash
        env:
          NEEDS_DEPENDENCIES: ${{ steps.changes.outputs.needs-dependencies }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          plan=$(cat build/check-plan.json)
          if [ "$NEEDS_DEPENDENCIES" = true ]; then
            if jq -es 'all(.[]; type == "object")' build/dependencies-x86.json build/dependencies-arm.json >/dev/null 2>&1 &&
               jq -s 'reduce .[] as $graph ({}; reduce ($graph | keys[]) as $name (.; .[$name] = ((.[$name] // []) + $graph[$name] | unique)))' \
                 build/dependencies-x86.json build/dependencies-arm.json > build/dependencies.json; then
              plan=$(python3 -B scripts/plan_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" --dependencies build/dependencies.json)
            else
              printf 'Dependency discovery unavailable; checking the full catalog.\n' >&2
            fi
          fi
          {
            printf 'chunks=%s\n' "$(jq -c '.chunks' <<< "$plan")"
            printf 'has-modules=%s\n' "$(jq -r '.modules | length > 0' <<< "$plan")"
            printf 'common=%s\n' "$(jq -r '.common' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Checks\n\n'
            printf -- '- Common (_shared and harness): %s\n' "$(jq -r 'if .common then "yes" else "no" end' <<< "$plan")"
            printf -- '- Modules (x86_64 and aarch64, eval then run): %s\n' "$(jq -r 'if (.modules | length) > 0 then (.modules | join(", ")) else "none" end' <<< "$plan")"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/lint

  test:
    name: Test ${{ matrix.chunk.id }} (${{ matrix.runner }})
    needs: plan
    if: ${{ needs.plan.outputs.has-modules == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/nix-tests.yml
    with:
      runner: ${{ matrix.runner }}
      suite: module
      mode: check
      modules: ${{ matrix.chunk.modules }}

  common:
    name: Common (${{ matrix.runner }})
    needs: plan
    if: ${{ needs.plan.outputs.common == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/nix-tests.yml
    with:
      runner: ${{ matrix.runner }}
      suite: common
      mode: check

  gate:
    if: always()
    needs: [plan, lint, test, common]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .plan.result == "success" and .lint.result == "success"
            and (if .plan.outputs["has-modules"] == "true"
                 then .test.result == "success" else .test.result == "skipped" end)
            and (if .plan.outputs.common == "true"
                 then .common.result == "success" else .common.result == "skipped" end)
          ' <<< "$JOB_RESULTS"
