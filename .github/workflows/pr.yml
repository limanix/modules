name: PR flow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    uses: mr-chelyshkin/actions/.github/workflows/pr-nix.yml@v1
    permissions:
      contents: read

  test:
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Restore Nix sources and local builds
        id: nix-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'catalog/**/releases.nix') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'catalog/**/releases.nix') }}-
            nix-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare Nix cache permissions
        run: |
          mkdir -p .cache/nix .cache/nix-binary
          sudo chown -R 0:0 .cache/nix .cache/nix-binary
      - name: Run Nix tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: >-
            ci/test ARCH=${{ matrix.arch }}
            'CONTAINER_ENVS=XDG_CACHE_HOME=/workspace/.cache NIX_BUILD_CACHE=/workspace/.cache/nix-binary NIX_CHECK_JOBS=4 NIX_CHECK_BATCH_SIZE=2'
      - name: Restore Nix cache ownership
        if: always()
        run: |
          for directory in .cache/nix .cache/nix-binary; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done
      - name: Save Nix sources and completed builds
        if: ${{ always() && !cancelled() && steps.nix-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: ${{ steps.nix-cache.outputs.cache-primary-key }}

  pkgs:
    name: Check Nixpkgs updates
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Prepare lock file permissions
        run: sudo chown 0:0 flake.lock
      - name: Check for Nixpkgs updates
        id: update
        continue-on-error: true
        timeout-minutes: 5
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: nixpkgs/update }
      - name: Restore lock file ownership
        if: always()
        run: |
          if [ -f flake.lock ]; then
            sudo chown "$(id -u):$(id -g)" flake.lock
          fi
      - name: Write update summary
        if: always()
        shell: bash
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: python3 scripts/summarize_nixpkgs_updates.py

  gate:
    if: always()
    needs: [nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
