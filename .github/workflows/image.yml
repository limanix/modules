name: Build images

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: ubuntu-24.04-arm }
          - { arch: x86_64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow user namespaces for systemd-repart
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the image
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: release/build
          args: ARCH=${{ matrix.arch }}
      - name: Keep the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
