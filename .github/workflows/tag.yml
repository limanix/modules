name: Tag flow

on:
  push:
    branches: [main]
    paths: [flake.lock, catalog/_shared/unstable.toml]

concurrency:
  group: tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'
      - name: Pick the next tag
        id: next
        env:
          BASE_REVISION: ${{ github.event.before }}
        run: task --yes harness -- release tag --base "$BASE_REVISION" >> "$GITHUB_OUTPUT"
      - name: Create token
        if: steps.next.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          repositories: modules
          owner: limanix
      - name: Tag ${{ steps.next.outputs.tag }}
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
