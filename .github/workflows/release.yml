name: Release flow

on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check module tag format
        uses: mr-chelyshkin/actions/check-tag-format@v1
        with:
          pattern: '^v[1-9][0-9]*$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: mr-chelyshkin/actions/check-tag-branch@v1
        with:
          branch: main

  docs:
    name: Prepare docs
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare documentation sources
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: docs/prepare MODULES_REF=${{ github.ref_name }}
      - name: Package documentation
        run: tar -czf build/docs.tar.gz -C build/docs .
      - name: Upload documentation archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: build/docs.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    name: Create GitHub release
    needs: [verify, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download docs archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: build
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          draft: false
          files: build/docs.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: false

  notify-client:
    name: Notify client
    needs: release
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Create token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          repositories: client
          owner: limanix
      - name: Send event
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODULES_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh api --method POST repos/limanix/client/dispatches \
            -f event_type=modules-release \
            -f "client_payload[tag]=$MODULES_TAG"
