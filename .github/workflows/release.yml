name: Release flow

on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check module tag format
        uses: mr-chelyshkin/actions/tag-format-check@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
        with:
          pattern: '^v[1-9][0-9]*$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: mr-chelyshkin/actions/tag-branch-check@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
        with:
          branch: main

  image:
    needs: verify
    uses: ./.github/workflows/image.yml

  release:
    name: Create GitHub release
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'
      - name: Write the image manifest
        env:
          TAG: ${{ github.ref_name }}
        run: task --yes harness CONTAINER_USER=host -- release manifest "$TAG"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          draft: false
          files: |
            dist/limanix-*.qcow2
            dist/limanix-*.qcow2.sha256
            dist/image.json
          fail_on_unmatched_files: true
          overwrite_files: false

  notify-client:
    name: Notify client
    needs: release
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Create token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          repositories: client
          owner: limanix
      - name: Send event
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODULES_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh api --method POST repos/limanix/client/dispatches \
            -f event_type=modules-release \
            -f "client_payload[tag]=$MODULES_TAG"
