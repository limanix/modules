name: Release flow

on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - name: Check module tag format
        uses: mr-chelyshkin/actions/check-tag-format@v1
        with:
          pattern: '^v[1-9][0-9]*$'
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: mr-chelyshkin/actions/check-tag-branch@v1
        with:
          branch: main

      - name: Test runner and change planning
        run: python3 -B -m unittest discover -s scripts/tests
      - name: Plan all module checks
        id: plan
        shell: bash
        run: |
          plan=$(python3 -B scripts/plan_checks.py --all)
          printf 'chunks=%s\n' "$(jq -c '.chunks' <<< "$plan")" >> "$GITHUB_OUTPUT"

  quality:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        task: [ci/nixos-fmt, ci/nixos-lint]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ${{ matrix.task }}

  test:
    name: Modules (${{ matrix.runner }}, ${{ matrix.chunk.id }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        chunk: ${{ fromJSON(needs.verify.outputs.chunks) }}
    uses: ./.github/workflows/nix-tests.yml
    with:
      task: ci/test
      runner: ${{ matrix.runner }}
      modules: ${{ matrix.chunk.modules }}
      cache-id: modules-${{ matrix.chunk.id }}

  common:
    name: Common (${{ matrix.runner }}, ${{ matrix.suite.id }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        suite:
          - {id: base, mode: release-eval, group: base}
          - {id: compositions, mode: release-eval, group: compositions}
          - {id: versions, mode: release-eval, group: versions}
          - {id: smoke, mode: release-smoke, group: all}
    uses: ./.github/workflows/nix-tests.yml
    with:
      task: ci/common
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.suite.mode }}
      integration-group: ${{ matrix.suite.group }}
      cache-id: common-${{ matrix.suite.id }}

  docs:
    name: Prepare docs
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare documentation sources
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: docs/prepare MODULES_REF=${{ github.ref_name }}
      - name: Package documentation
        run: tar -czf build/docs.tar.gz -C build/docs .
      - name: Upload documentation archive
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/docs.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    name: Create GitHub release
    if: ${{ always() && !cancelled() }}
    needs: [test, common, quality, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
    steps:
      - name: Require every publication check
        uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
      - name: Download docs archive
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: build
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          draft: false
          files: build/docs.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: false

  notify-client:
    name: Notify client
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Create token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          repositories: client
          owner: limanix
      - name: Send event
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODULES_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh api --method POST repos/limanix/client/dispatches \
            -f event_type=modules-release \
            -f "client_payload[tag]=$MODULES_TAG"
