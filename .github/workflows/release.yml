name: Release flow

on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has-modules: ${{ steps.plan.outputs.has-modules }}
      vm-chunks: ${{ steps.vm-plan.outputs.vm-chunks }}
      has-vm: ${{ steps.vm-plan.outputs.has-vm }}
    steps:
      - name: Check module tag format
        uses: mr-chelyshkin/actions/check-tag-format@v1
        with:
          pattern: '^v[1-9][0-9]*$'
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: mr-chelyshkin/actions/check-tag-branch@v1
        with:
          branch: main

      - name: Plan all module checks
        id: plan
        shell: bash
        run: |
          plan=$(python3 -B scripts/plan_checks.py --all)
          {
            printf 'chunks=%s\n' "$(jq -c '.chunks' <<< "$plan")"
            printf 'has-modules=%s\n' "$(jq -r '.modules | length > 0' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"

      - name: Find x86 VM tests
        timeout-minutes: 5
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/plan/vm-modules SYSTEM=x86_64-linux OUTPUT=build/vm-x86.json

      - name: Find ARM VM tests
        timeout-minutes: 5
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/plan/vm-modules SYSTEM=aarch64-linux OUTPUT=build/vm-arm.json

      - name: Plan VM checks
        id: vm-plan
        shell: bash
        run: |
          chunks=$(jq -cn --argjson x86 "$(cat build/vm-x86.json)" --argjson arm "$(cat build/vm-arm.json)" \
            '[$x86[] | {id: ., modules: ., runner: "ubuntu-24.04"}] + [$arm[] | {id: ., modules: ., runner: "ubuntu-24.04-arm"}]')
          {
            printf 'vm-chunks=%s\n' "$chunks"
            printf 'has-vm=%s\n' "$(jq -r 'length > 0' <<< "$chunks")"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/lint

  test:
    name: Test ${{ matrix.chunk.id }} (${{ matrix.runner }})
    needs: verify
    if: ${{ needs.verify.outputs.has-modules == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.verify.outputs.chunks) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/nix-tests.yml
    with:
      runner: ${{ matrix.runner }}
      suite: module
      mode: check
      modules: ${{ matrix.chunk.modules }}

  common:
    name: Common (${{ matrix.runner }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/nix-tests.yml
    with:
      runner: ${{ matrix.runner }}
      suite: common
      mode: check

  vm:
    name: VM ${{ matrix.check.id }} (${{ matrix.check.runner }})
    needs: [verify, test, common]
    if: ${{ needs.verify.outputs.has-vm == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.verify.outputs.vm-chunks) }}
    uses: ./.github/workflows/nix-tests.yml
    with:
      runner: ${{ matrix.check.runner }}
      suite: module
      mode: vm
      modules: ${{ matrix.check.modules }}

  docs:
    name: Prepare docs
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare documentation sources
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: docs/prepare MODULES_REF=${{ github.ref_name }}
      - name: Package documentation
        run: tar -czf build/docs.tar.gz -C build/docs .
      - name: Upload documentation archive
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/docs.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    name: Create GitHub release
    if: ${{ always() && !cancelled() }}
    needs: [verify, lint, test, common, vm, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require every publication check
        uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
          skipped: ${{ format('{0}{1}', needs.verify.outputs.has-modules != 'true' && 'test ' || '', needs.verify.outputs.has-vm != 'true' && 'vm' || '') }}
      - name: Download docs archive
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: build
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          draft: false
          files: build/docs.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: false

  notify-client:
    name: Notify client
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Create token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          repositories: client
          owner: limanix
      - name: Send event
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODULES_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh api --method POST repos/limanix/client/dispatches \
            -f event_type=modules-release \
            -f "client_payload[tag]=$MODULES_TAG"
