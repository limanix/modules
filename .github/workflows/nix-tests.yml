name: Native Nix tests

on:
  workflow_call:
    inputs:
      runner:
        description: Native Linux runner
        type: string
        required: true
      suite:
        description: module (catalog modules) or common (_shared and the harness)
        type: string
        default: module
      mode:
        description: check (eval, then run) or vm (activation tests; needs KVM)
        type: string
        default: check
      modules:
        description: Space-separated module names for the module suite
        type: string
        default: ''

permissions:
  contents: read

env:
  # Runs on main publish caches; pull requests and tags only read them.
  PUBLISH_CACHE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  test:
    name: ${{ inputs.suite == 'module' && inputs.modules || inputs.suite }} ${{ inputs.mode }}
    runs-on: ${{ inputs.runner }}
    env:
      TARGET: ${{ inputs.suite == 'module' && inputs.modules || inputs.suite }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # One cache per target and architecture: downloaded sources and the
      # outputs the target builds locally. Prefix restore reuses the previous
      # snapshot; runs on main prune it to what they needed before saving.
      - name: Restore Nix sources and local builds
        id: cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: nix-v7-${{ runner.arch }}-${{ env.TARGET }}-${{ hashFiles('flake.lock', 'flake.nix', 'interface.nix', 'catalog/**', 'checks/**', 'scripts/run_checks.sh', 'scripts/cache_nix_build.sh', 'scripts/prune_nix_cache.sh') }}
          restore-keys: |
            nix-v7-${{ runner.arch }}-${{ env.TARGET }}-

      - name: Prepare Nix cache permissions
        run: |
          mkdir -p .cache/nix .cache/nix-binary
          sudo chown -R 0:0 .cache/nix .cache/nix-binary

      - name: Require KVM
        if: ${{ inputs.mode == 'vm' }}
        run: |
          if [ ! -c /dev/kvm ]; then
            printf 'VM checks require a native Linux runner with KVM.\n' >&2
            exit 1
          fi

      - name: Run Nix checks
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: >-
            ${{ inputs.suite == 'module' && 'ci/test/modules' || 'ci/test/common' }}
            'SUITE=${{ inputs.suite }}' 'MODE=${{ inputs.mode }}' 'MODULES=${{ inputs.modules }}'
            ${{ inputs.mode == 'vm' && 'CONTAINER_RUN_ARGS=--device=/dev/kvm' || '' }}
            'CONTAINER_ENVS=NIX_BUILD_CACHE=/workspace/.cache/nix-binary NIX_CHECK_JOBS=1 NIX_BUILD_CORES=0${{ env.PUBLISH_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true' && ' NIX_BUILD_CACHE_HOOK=/workspace/scripts/cache_nix_build.sh' || '' }}'

      - name: Restore Nix cache ownership
        if: always()
        run: |
          for directory in .cache/nix .cache/nix-binary; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done

      # Saved narinfo lookups could hide pruned or newly added paths from the
      # next run, so each run starts with an empty lookup cache.
      - name: Prune Nix build cache
        id: prune
        if: ${{ success() && env.PUBLISH_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          pruned=$(bash scripts/prune_nix_cache.sh .cache/nix-binary)
          rm -f .cache/nix/binary-cache-v*.sqlite*
          printf '### Nix cache\n\n%s\n\n```\n%s\n```\n' "$pruned" "$(du -sh .cache/nix .cache/nix-binary)" >> "$GITHUB_STEP_SUMMARY"

      - name: Save Nix sources and local builds
        if: ${{ success() && env.PUBLISH_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.prune.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: ${{ steps.cache.outputs.cache-primary-key }}
