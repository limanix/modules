name: Native Nix tests

on:
  workflow_call:
    inputs:
      task:
        description: Taskfile check task to run
        type: string
        required: true
      runner:
        description: Native Linux runner
        type: string
        required: true
      modules:
        description: Space-separated module names for ci/test
        type: string
        default: ''
      mode:
        description: Shared check depth for ci/common
        type: string
        default: pr
      cache-id:
        description: Module chunk or check suite identifier
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.cache-id }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore Nix sources and local builds
        id: nix-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'catalog/**/releases.nix') }}-${{ inputs.cache-id }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'catalog/**/releases.nix') }}-${{ inputs.cache-id }}-
            nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'catalog/**/releases.nix') }}-
            nix-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare Nix cache permissions
        run: |
          mkdir -p .cache/nix .cache/nix-binary
          sudo chown -R 0:0 .cache/nix .cache/nix-binary
      - name: Run Nix checks
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: >-
            ${{ inputs.task }}
            ${{ inputs.task == 'ci/test' && format('MODULES="{0}"', inputs.modules) || format('MODE={0}', inputs.mode) }}
            'CONTAINER_ENVS=XDG_CACHE_HOME=/workspace/.cache NIX_BUILD_CACHE=/workspace/.cache/nix-binary NIX_CHECK_JOBS=4 NIX_CHECK_BATCH_SIZE=4'
      - name: Restore Nix cache ownership
        if: always()
        run: |
          for directory in .cache/nix .cache/nix-binary; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done
      - name: Save Nix sources and completed builds
        if: ${{ always() && !cancelled() && steps.nix-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/nix
            .cache/nix-binary
          key: ${{ steps.nix-cache.outputs.cache-primary-key }}
