name: Update flow

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nixpkgs:
    name: Update Nixpkgs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Update Nixpkgs within NixOS
        id: nixpkgs
        run: python3 tools/harness update nixpkgs >> "$GITHUB_OUTPUT"
      - name: Create token
        if: steps.nixpkgs.outputs.before != steps.nixpkgs.outputs.after
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: modules
          owner: limanix
      - name: Open the pull request
        if: steps.nixpkgs.outputs.before != steps.nixpkgs.outputs.after
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/nixpkgs
          labels: deps
          add-paths: flake.lock
          commit-message: Update Nixpkgs to ${{ steps.nixpkgs.outputs.date }}
          title: Update Nixpkgs to ${{ steps.nixpkgs.outputs.date }}
          body: >-
            Moves NixOS ${{ steps.nixpkgs.outputs.release }} from ${{ steps.nixpkgs.outputs.before }}
            to ${{ steps.nixpkgs.outputs.after }}. It merges itself once the checks pass, and the merge
            releases the catalog.
      - name: Merge once the checks pass
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

  unstable:
    name: Update nixos-unstable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Move to the newest nixos-unstable
        id: unstable
        run: python3 tools/harness update unstable >> "$GITHUB_OUTPUT"
      - name: Create token
        if: steps.unstable.outputs.before != steps.unstable.outputs.after
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: modules
          owner: limanix
      - name: Open the pull request
        if: steps.unstable.outputs.before != steps.unstable.outputs.after
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/unstable
          labels: deps
          add-paths: catalog/_shared/unstable.toml
          commit-message: Update nixos-unstable to ${{ steps.unstable.outputs.date }}
          title: Update nixos-unstable to ${{ steps.unstable.outputs.date }}
          body: >-
            Moves the catalog's nixos-unstable revision from ${{ steps.unstable.outputs.before }}
            to ${{ steps.unstable.outputs.after }}. It merges itself once the checks pass, and the
            merge releases the catalog. A line that moved to another one fails its module's eval
            check and waits for a reviewer.
      - name: Merge once the checks pass
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

  drift:
    name: Report catalog drift
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Keep the drift issue current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/harness drift

  nixos:
    name: Move to the next NixOS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Look for the next NixOS release
        id: nixos
        run: python3 tools/harness update nixos >> "$GITHUB_OUTPUT"
      - name: Create token
        if: steps.nixos.outputs.next != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: modules
          owner: limanix
      - name: Open the pull request
        if: steps.nixos.outputs.next != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/nixos-${{ steps.nixos.outputs.next }}
          labels: deps
          add-paths: |
            flake.nix
            flake.lock
          commit-message: Move to NixOS ${{ steps.nixos.outputs.next }}
          title: Move to NixOS ${{ steps.nixos.outputs.next }}
          body: >-
            Moves Nixpkgs from nixos-${{ steps.nixos.outputs.current }} to nixos-${{ steps.nixos.outputs.next }}.
            This is a new NixOS release and does not merge itself: fix image.nix or platform.nix if the
            build fails, and boot the image artifact of the checks in Lima before merging.
