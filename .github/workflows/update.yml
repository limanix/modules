name: Check update flow

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update ${{ matrix.input }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        input: [nixpkgs, nixos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'
      - name: Update the pinned input
        id: update
        env:
          INPUT: ${{ matrix.input }}
        run: task --yes harness -- update "$INPUT" >> "$GITHUB_OUTPUT"
      - name: Update nixos-unstable
        if: matrix.input == 'nixpkgs'
        id: unstable
        run: task --yes harness -- update unstable >> "$GITHUB_OUTPUT"
      - name: Create token
        if: steps.update.outputs.next != '' || steps.update.outputs.before != steps.update.outputs.after || steps.unstable.outputs.before != steps.unstable.outputs.after
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: modules
          owner: limanix
      - name: Open the pull request
        if: steps.app-token.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/${{ matrix.input }}${{ matrix.input == 'nixos' && format('-{0}', steps.update.outputs.next) || '' }}
          labels: deps
          add-paths: |
            flake.nix
            flake.lock
            catalog/_shared/unstable.toml
          commit-message: ${{ matrix.input == 'nixos' && format('Update nixos to {0}', steps.update.outputs.next) || 'Update nixpkgs and nixos-unstable' }}
          title: ${{ matrix.input == 'nixos' && format('Update nixos to {0}', steps.update.outputs.next) || 'Update nixpkgs and nixos-unstable' }}
          body: |
            ${{ steps.update.outputs.next && format('Updates nixos from {0} to {1}.', steps.update.outputs.current, steps.update.outputs.next) || '' }}
            ${{ steps.update.outputs.before != steps.update.outputs.after && format('Updates nixpkgs from {0} to {1}.', steps.update.outputs.before, steps.update.outputs.after) || '' }}
            ${{ steps.unstable.outputs.before != steps.unstable.outputs.after && format('Updates nixos-unstable from {0} to {1}.', steps.unstable.outputs.before, steps.unstable.outputs.after) || '' }}

            ${{ matrix.input == 'nixos' && 'This is a new NixOS release and needs review: fix any image build failures and boot its image artifact in Lima before merging.' || 'Merge it once the checks pass; the merge releases the catalog.' }}

  drift:
    name: Report catalog drift
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'
      - name: Keep the drift issue current
        env:
          GH_TOKEN: ${{ github.token }}
        run: task --yes harness -- drift
