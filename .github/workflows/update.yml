name: Update flow

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update ${{ matrix.input }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        input: [nixpkgs, unstable, nixos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'
      - name: Update the pinned input
        id: update
        env:
          INPUT: ${{ matrix.input }}
        run: task --yes harness -- update "$INPUT" >> "$GITHUB_OUTPUT"
      - name: Create token
        if: steps.update.outputs.next != '' || steps.update.outputs.before != steps.update.outputs.after
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: modules
          owner: limanix
      - name: Open the pull request
        if: steps.update.outputs.next != '' || steps.update.outputs.before != steps.update.outputs.after
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/${{ matrix.input }}${{ matrix.input == 'nixos' && format('-{0}', steps.update.outputs.next) || '' }}
          labels: deps
          add-paths: |
            flake.nix
            flake.lock
            catalog/_shared/unstable.toml
          commit-message: Update ${{ matrix.input }} to ${{ steps.update.outputs.next || steps.update.outputs.date }}
          title: Update ${{ matrix.input }} to ${{ steps.update.outputs.next || steps.update.outputs.date }}
          body: |
            Updates ${{ matrix.input }} from ${{ steps.update.outputs.current || steps.update.outputs.before }} to ${{ steps.update.outputs.next || steps.update.outputs.after }}.

            ${{ matrix.input == 'nixos' && 'This is a new NixOS release and needs review: fix any image build failures and boot its image artifact in Lima before merging.' || 'Merges once the checks pass; the merge releases the catalog. A version line that moved waits for a reviewer.' }}
      - name: Merge once the checks pass
        if: matrix.input != 'nixos' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

  drift:
    name: Report catalog drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'
      - name: Keep the drift issue current
        env:
          GH_TOKEN: ${{ github.token }}
        run: task --yes harness -- drift
