set -g mouse on
set -s set-clipboard on
set -as terminal-features ',xterm*:RGB:clipboard'

set -g status-style 'bg=@theme-background_dark@,fg=@theme-foreground@'
set -g message-style 'bg=@theme-surface@,fg=@theme-foreground@'
set -g message-command-style 'bg=@theme-surface@,fg=@theme-foreground@'
set -g mode-style 'fg=@theme-accent@,bg=@theme-background@,reverse'
set -g pane-border-style 'fg=@theme-border@'
set -g pane-active-border-style 'fg=@theme-accent@'
set -g window-status-style 'bg=@theme-background_dark@,fg=@theme-subtle@'
set -g window-status-current-style 'fg=@theme-accent@,bg=@theme-background@,reverse,bold'
set -g window-status-activity-style 'bg=@theme-background_dark@,fg=@theme-orange@'
set -g window-status-bell-style 'bg=@theme-background_dark@,fg=@theme-red@,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g status-left '#[fg=@theme-accent@,bg=@theme-background@,reverse,bold] #S #[default] '
set -g status-left-length 40
set -g status-right '#[fg=@theme-orange@,bold]#(/run/current-system/sw/bin/lmx status --short)#[default] #[fg=@theme-subtle@]%a %d %b #[fg=@theme-foreground@]%H:%M '
set -g status-right-length 80

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
