[fzf]
name = "fzf"
text = "In Zsh, Ctrl-T inserts paths and Alt-C changes directory through fzf."
with = ["zsh"]

[bat]
name = "bat"
text = "bat and delta highlight in the colors of the theme."
with = ["delta", "theme"]

[delta]
name = "delta"
text = "`git diff` and `git log -p` page through delta."
with = ["bat", "theme"]

[ripgrep]
