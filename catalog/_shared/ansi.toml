# The terminal colors that stand for the palette's roles with the system theme: the number of one
# of the terminal's 16 colors, 0 to 15, or "default" for its own foreground or background. Hues
# and the accent take their ANSI color; quiet text and surfaces take bright black, which terminal
# themes keep readable on their background, light or dark.

background = "default"
background_dark = "default"
background_darker = "default"
surface = 8
selection = 8
border = 8
muted = 8
subtle = 8
foreground = "default"
accent = 5
red = 1
orange = 11
yellow = 3
green = 2
cyan = 6
blue = 4
purple = 5
pink = 13
