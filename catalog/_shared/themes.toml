# The guest's themes. Each table holds `title`, `homepage`, `dark`, true for a dark background, and
# the 18 colors that modules read by role. The values come from the theme's own Neovim colorscheme
# in the locked Nixpkgs and its published palette; a role the theme has no color for takes its
# nearest one.

# catppuccin-nvim, colorscheme catppuccin-mocha.
[catppuccin-mocha]
title = "Catppuccin Mocha"
homepage = "https://catppuccin.com/palette/"
dark = true
background = "#1e1e2e"
background_dark = "#181825"
background_darker = "#11111b"
surface = "#313244"
selection = "#45475a"
border = "#585b70"
muted = "#9399b2"
subtle = "#a6adc8"
foreground = "#cdd6f4"
accent = "#cba6f7"
red = "#f38ba8"
orange = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
cyan = "#94e2d5"
blue = "#89b4fa"
purple = "#cba6f7"
pink = "#f5c2e7"

