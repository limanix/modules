set -g mouse on
set -s set-clipboard on
set -as terminal-features ',xterm*:RGB:clipboard'

# The Catppuccin colors of the guest's theme: https://catppuccin.com/palette/
# Load styles before plugins so continuum can append its status-right hook.
set -g status-style 'bg=@theme-mantle@,fg=@theme-text@'
set -g message-style 'bg=@theme-surface0@,fg=@theme-text@'
set -g message-command-style 'bg=@theme-surface0@,fg=@theme-text@'
set -g mode-style 'bg=@theme-mauve@,fg=@theme-base@'
set -g pane-border-style 'fg=@theme-surface1@'
set -g pane-active-border-style 'fg=@theme-mauve@'
set -g window-status-style 'bg=@theme-mantle@,fg=@theme-subtext0@'
set -g window-status-current-style 'bg=@theme-mauve@,fg=@theme-base@,bold'
set -g window-status-activity-style 'bg=@theme-mantle@,fg=@theme-peach@'
set -g window-status-bell-style 'bg=@theme-mantle@,fg=@theme-red@,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g status-left '#[bg=@theme-mauve@,fg=@theme-base@,bold] #S #[default] '
set -g status-left-length 40
# lmx status --short prints the words that need attention, such as restart, or nothing.
set -g status-right '#[fg=@theme-peach@,bold]#(/run/current-system/sw/bin/lmx status --short)#[default] #[fg=@theme-subtext0@]%a %d %b #[fg=@theme-text@]%H:%M '
set -g status-right-length 80

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keep continuum last: automatic saving uses the status-right hook.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
