set -g mouse on
set -s set-clipboard on
set -as terminal-features ',xterm*:RGB:clipboard'

# Catppuccin Mocha: https://catppuccin.com/palette/#mocha
# Load styles before plugins so continuum can append its status-right hook.
set -g status-style 'bg=@mocha-mantle@,fg=@mocha-text@'
set -g message-style 'bg=@mocha-surface0@,fg=@mocha-text@'
set -g message-command-style 'bg=@mocha-surface0@,fg=@mocha-text@'
set -g mode-style 'bg=@mocha-mauve@,fg=@mocha-base@'
set -g pane-border-style 'fg=@mocha-surface1@'
set -g pane-active-border-style 'fg=@mocha-mauve@'
set -g window-status-style 'bg=@mocha-mantle@,fg=@mocha-subtext0@'
set -g window-status-current-style 'bg=@mocha-mauve@,fg=@mocha-base@,bold'
set -g window-status-activity-style 'bg=@mocha-mantle@,fg=@mocha-peach@'
set -g window-status-bell-style 'bg=@mocha-mantle@,fg=@mocha-red@,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g status-left '#[bg=@mocha-mauve@,fg=@mocha-base@,bold] #S #[default] '
set -g status-left-length 40
set -g status-right '#[fg=@mocha-subtext0@]%a %d %b #[fg=@mocha-text@]%H:%M '
set -g status-right-length 60

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keep continuum last: automatic saving uses the status-right hook.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
